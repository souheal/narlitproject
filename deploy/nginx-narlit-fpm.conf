server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/ubuntu/narlitproject/Back/public;
    index index.php;

    client_max_body_size 20M;

    # Next.js frontend (default) — reverse proxy for everything NOT handled below
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Laravel API — served directly via PHP-FPM (no proxy, more reliable than `artisan serve`)
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel storage (uploaded images)
    location /storage/ {
        alias /home/ubuntu/narlitproject/Back/storage/app/public/;
        access_log off;
        expires 7d;
    }

    # PHP handler — catches /index.php rewrites from /api
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
